name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  RTLSDR_SNAP_BINARIES: |-
    adsb
    biast
    eeprom
    fm
    power
    sdr
    tcp
    test
  RTLSDR_SNAP_SERVICES: |-
    tcp-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build snap
        id: build-snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      - name: Upload snap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.build-snap.outputs.snap }}
          if-no-files-found: error

  check-binaries:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download snap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap

      - name: Install snap
        run: |
          sudo snap install --dangerous ./*.snap

      - name: Check all binaries
        run: |
          actual=$(find /snap/bin -name 'rtlsdr.*' -printf '%f\n' | sed 's/^rtlsdr\.//' | sort)
          diff <(sort <<< "$RTLSDR_SNAP_BINARIES") <(echo "$actual")

  check-services:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download snap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap

      - name: Install snap
        run: |
          sudo snap install --dangerous ./*.snap

      - name: Check all services
        run: |
          actual=$(snap services rtlsdr | awk 'NR > 1 { sub(/^rtlsdr\./, "", $1); print $1 }' | sort)
          diff <(sort <<< "$RTLSDR_SNAP_SERVICES") <(echo "$actual")
